# golangci-lint v2 configuration
# Docs: https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - nilerr
    - prealloc
    - whitespace
  settings:
    revive:
      rules:
        - name: var-naming
        - name: package-comments
          disabled: true
    gosec:
      excludes:
        - G104  # already covered by errcheck
        - G304  # file-path-from-variable: too noisy for a service manager
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - ifElseChain
        - hugeParam
  exclusions:
    paths:
      - internal/web/dist
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam
      - path: cmd/
        linters:
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/hilman2/ELNSSM
