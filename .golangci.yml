# golangci-lint configuration
# Docs: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - gosimple
    - misspell
    - revive
    - unconvert
    - unparam
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gosec
    - nilerr
    - prealloc
    - whitespace

linters-settings:
  goimports:
    local-prefixes: github.com/hilman2/ELNSSM
  revive:
    rules:
      - name: var-naming
      - name: package-comments
      - name: exported
        disabled: true
  gosec:
    excludes:
      - G104  # already covered by errcheck
      - G304  # file-path-from-variable: too noisy for a service manager
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
    disabled-checks:
      - ifElseChain
      - hugeParam

issues:
  exclude-dirs:
    - internal/web/dist
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - unparam
    - path: cmd/
      linters:
        - gocritic
  max-issues-per-linter: 0
  max-same-issues: 0
